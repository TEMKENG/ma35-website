  <div class="code">404</div>
  <p>Diese Strecke ist nicht kartiert. Sie werden gleich zur Startseite gebracht.</p>
  <a id="home" href="/">Zur Startseite</a>

<script>
// Startseite finden: bei Projektseiten liegt sie unter /<repo>/, bei Nutzerseiten unter /.
(async function () {
  var home = '/';
  var seg = location.pathname.split('/').filter(Boolean)[0];
  if (seg) {
    try {
      var r = await fetch('/' + seg + '/', { cache: 'no-store' });
      if (r.ok && (await r.text()).indexOf('data-ma35-home') !== -1) home = '/' + seg + '/';
    } catch (e) {}
  }
  document.getElementById('home').href = home;
  setTimeout(function () { location.replace(home); }, 5000);
})();
</script>
